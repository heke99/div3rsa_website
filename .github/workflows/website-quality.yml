name: Website quality
on:
  push:
    branches: [main, design/trafexa-english-redesign]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Archive review source
        run: git archive --format=zip --output=website-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: website-source
          path: website-source.zip
          retention-days: 3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
