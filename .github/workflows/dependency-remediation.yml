name: Prepare audited dependency lock
on:
  push:
    branches: [design/trafexa-english-redesign]
    paths: [.github/workflows/dependency-remediation.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/design/trafexa-english-redesign' && github.repository == 'heke99/div3rsa_website'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Prepare targeted manifest changes
        run: |
          mkdir -p dependency-remediation
          cp package-lock.json dependency-remediation/before-package-lock.json
          node <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.dependencies.next = '16.3.5';
          p.dependencies.nodemailer = '10.0.10';
          p.devDependencies['eslint-config-next'] = '16.3.5';
          p.devDependencies.postcss = '8.5.23';
          // Nodemailer 10 ships its own declarations.
          delete p.devDependencies['@types/nodemailer'];
          p.overrides.postcss = '$postcss';
          p.scripts['audit:dependencies'] = 'node scripts/audit-dependencies.mjs';
          p.scripts['test:smtp'] = 'node --test scripts/smtp-compatibility.test.mjs';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund
      - name: Reinstall and require a clean complete dependency audit
        run: |
          npm ci
          npm audit --include=dev --include=optional --audit-level=low --json > dependency-remediation/audit-all.json
          npm audit --omit=dev --audit-level=low --json > dependency-remediation/audit-production.json
          node <<'NODE'
          const fs = require('node:fs');
          for (const kind of ['all', 'production']) {
            const report = JSON.parse(fs.readFileSync(`dependency-remediation/audit-${kind}.json`, 'utf8'));
            if (report.metadata?.vulnerabilities?.total !== 0 || report.error) throw new Error(`Audit ${kind} is not clean`);
            console.log(`${kind}: zero reported vulnerabilities`);
          }
          NODE
      - run: npm run lint
      - run: npm run build
      - name: Stage only reviewed dependency blobs, without modifying any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const crypto = require('node:crypto');
          const result = { sourceCommit: process.env.GITHUB_SHA, files: {} };
          for (const file of ['package.json', 'package-lock.json']) {
            const content = fs.readFileSync(file, 'utf8');
            fs.writeFileSync(`dependency-remediation/${file}`, content);
            const blob = JSON.parse(cp.execFileSync('gh', ['api', '--method', 'POST', `repos/${process.env.GITHUB_REPOSITORY}/git/blobs`, '--input', '-'], { input: JSON.stringify({content, encoding: 'utf-8'}), encoding: 'utf8' }));
            result.files[file] = { blob: blob.sha, sha256: crypto.createHash('sha256').update(content).digest('hex') };
          }
          fs.writeFileSync('dependency-remediation/result.json', JSON.stringify(result, null, 2));
          console.log(JSON.stringify(result, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-remediation
          path: dependency-remediation/
          retention-days: 7
